   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #5b6873" transform="translate(7.2 321.431156)">All panels use the same 500,000 validation rows. Seed changes the training subset, not the held-out test set.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #5b6873" transform="translate(7.2 331.033344)">Error bars capture validation evaluation noise only; three seeds do not estimate total training uncertainty.</text>
  </g>
 </g>
