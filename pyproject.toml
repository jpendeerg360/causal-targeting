[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-targeting"
version = "1.0.0"
description = "Reproducible advertising assignment policy evaluation on corrected Criteo Uplift"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "duckdb", "pyarrow", "matplotlib", "joblib", "threadpoolctl"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
causal-targeting = "causal_targeting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
